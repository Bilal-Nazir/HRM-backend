# Dedicated IP-only HRM virtual host; existing named sites remain unchanged.
server {
    listen 80;
    server_name 3.126.250.133;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hrm-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# IP browsers often omit SNI. Select the IP certificate for those connections;
# named SNI requests still select the existing CustomerCore certificate.
server {
    listen 443 ssl default_server;
    server_name 3.126.250.133;
    ssl_certificate /etc/letsencrypt/live/3.126.250.133/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.126.250.133/privkey.pem;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
